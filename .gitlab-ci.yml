stages:
  - build
  - publish

image: mcr.microsoft.com/dotnet/sdk:10.0

# Optional: Automatically build and test on every push/merge request
build_core:
  stage: build
  script:
    - dotnet restore
    - dotnet build -c Release --no-restore

# Automatically publish the NuGet package when pushing to main (or via a tag)
publish_core:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"' # Or trigger on version tags like '$CI_COMMIT_TAG'
  script:
    - dotnet restore
    - dotnet pack -c Release --no-restore -o ./artifacts
    - dotnet nuget push "./artifacts/*.nupkg" --source GitLabNHibernate --skip-duplicate
